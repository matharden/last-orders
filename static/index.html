<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boozer App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Boozer Dashboard</h1>
            <button id="logout-btn" class="btn secondary">Logout</button>
        </header>

        <main>
            <section class="card glass">
                <h2>Add Data</h2>
                <form id="data-form">
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label for="drink">Drink</label>
                        <input type="text" id="drink" name="drink" required placeholder="e.g. Camden Ale">
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" name="amount" required step="any" placeholder="e.g. 1">
                    </div>
                    <div class="form-group">
                        <label for="size">Size (ml)</label>
                        <input type="number" id="size" name="size" required placeholder="e.g. 330">
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <input type="text" id="notes" name="notes" placeholder="e.g. delicious, hoppy">
                    </div>
                    <button type="submit" class="btn primary">Add to Sheet</button>
                </form>
            </section>

            <section class="card glass mt-2">
                <h2>Current Data</h2>
                <div class="table-container">
                    <table id="data-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Drink</th>
                                <th>Amount</th>
                                <th>Size</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody id="data-body">
                            <tr><td colspan="5" class="text-center">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
                <button id="refresh-btn" class="btn secondary mt-1">Refresh Data</button>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
